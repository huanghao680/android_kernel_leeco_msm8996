name: Build Kernel for LeMax2 (x2)

on:
  push:
    branches: [lineage-18.1, integrate-resukisu]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make libncurses-dev zip python3 python3-pip

      - name: Download GCC toolchain
        run: |
          git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Configure AnyKernel3
        run: |
          cd anykernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=x2/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot|' anykernel.sh

      - name: Suppress git dirty marker
        run: echo -n "" > .scmversion

      - name: Setup ReSukiSU
        if: github.ref == 'refs/heads/integrate-resukisu'
        run: |
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          ln -sf $(pwd)/KernelSU/kernel drivers/kernelsu

      - name: Build kernel
        run: |
          export PATH=$PATH:$(pwd)/toolchain/bin
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          make O=out mrproper
          make O=out lineage_x2_defconfig
          make O=out -j$(nproc)

      - name: Package Droidspaces-only zip
        run: |
          cp -r anykernel3 AnyKernel3-Droidspaces
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3-Droidspaces/
          cd AnyKernel3-Droidspaces
          zip -r9 ../Droidspaces-x2-kernel.zip * -x '*.git*' 'README.md' 'LICENSE'

      - name: Download APatch tools
        run: |
          curl -skL "https://github.com/bmax121/KernelPatch/releases/latest/download/kptools-linux" -o kptools
          chmod +x kptools
          curl -skL "https://github.com/bmax121/KernelPatch/releases/latest/download/kpimg-android" -o kpimg

      - name: Patch kernel with APatch
        run: |
          cd out/arch/arm64/boot
          cp Image.gz-dtb Image.gz-dtb.bak
          # Image.gz-dtb = Image.gz (compressed kernel) + appended DTBs
          # Split: extract the gzip stream (compressed kernel) separately
          python3 -c "
          import gzip, io
          with open('Image.gz-dtb', 'rb') as f:
              data = f.read()
          # Find end of gzip stream
          import struct
          pos = data.rfind(b'\x1f\x8b\x08')  # last gzip header
          # Actually, gzip stream ends with 8-byte trailer
          # Find the last gzip stream end marker
          idx = len(data) - 1
          while idx > 0 and data[idx] != 0x1f:
              idx -= 1
              if idx > 0 and data[idx] == 0x1f and data[idx+1] == 0x8b:
                  break
          # Simpler: just use the separate Image.gz which is already the compressed kernel
          # The DTBs are appended after the gzip stream in Image.gz-dtb
          # We can get DTB size = Image.gz-dtb size - Image.gz size
          import os
          gzip_size = os.path.getsize('Image.gz')
          dtb_size = os.path.getsize('Image.gz-dtb') - gzip_size
          print(f'Image.gz: {gzip_size} bytes')
          print(f'DTB portion: {dtb_size} bytes')
          with open('Image.gz-dtb', 'rb') as f:
              f.seek(gzip_size)
              dtb = f.read()
          with open('dtb_part', 'wb') as f:
              f.write(dtb)
          print(f'Saved dtb_part: {len(dtb)} bytes')
          "
          # Decompress the kernel
          gunzip -c Image.gz > Image.raw
          # Patch with APatch (skey = super key)
          cd ../../../..
          ./kptools -p --image out/arch/arm64/boot/Image.raw --skey "123456789" --kpimg kpimg --out out/arch/arm64/boot/Image.patched
          # Repackage: gzip compressed kernel + appended DTBs
          cd out/arch/arm64/boot
          gzip -c Image.patched > Image.gz.patched
          cat Image.gz.patched dtb_part > Image.gz-dtb.patched
          ls -lh Image.gz-dtb.patched Image.gz-dtb.bak

      - name: Package Droidspaces+APatch zip
        run: |
          cp -r anykernel3 AnyKernel3-Droidspaces-APatch
          cp out/arch/arm64/boot/Image.gz-dtb.patched AnyKernel3-Droidspaces-APatch/Image.gz-dtb
          cd AnyKernel3-Droidspaces-APatch
          zip -r9 ../Droidspaces-APatch-x2-kernel.zip * -x '*.git*' 'README.md' 'LICENSE'

      - name: Package ReSukiSU zip
        if: github.ref == 'refs/heads/integrate-resukisu'
        run: |
          cp -r anykernel3 AnyKernel3-ReSukiSU
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3-ReSukiSU/
          cd AnyKernel3-ReSukiSU
          zip -r9 ../Droidspaces-ReSukiSU-x2.zip * -x '*.git*' 'README.md' 'LICENSE'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zips
          path: |
            Droidspaces-x2-kernel.zip
            Droidspaces-APatch-x2-kernel.zip
            Droidspaces-ReSukiSU-x2.zip
          retention-days: 30

      - name: Release (lineage-18.1)
        if: github.ref == 'refs/heads/lineage-18.1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: droidspaces-apatch-${{ github.run_number }}
          name: "Droidspaces + APatch Build #${{ github.run_number }}"
          body: |
            ## Droidspaces + APatch Kernel for LeMax2 (x2)

            | 文件 | 说明 |
            |------|------|
            | `Droidspaces-x2-kernel.zip` | 纯 Droidspaces 内核，AnyKernel3 格式 |
            | `Droidspaces-APatch-x2-kernel.zip` | Droidspaces + APatch 内核，已内置超级密钥 |
            | `boot-stock-lineage.img` | 原厂 LineageOS boot.img，备用 |

            **APatch SuperKey**: `123456789`
          files: |
            Droidspaces-x2-kernel.zip
            Droidspaces-APatch-x2-kernel.zip
            prebuilts/boot-stock-lineage.img
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release (integrate-resukisu)
        if: github.ref == 'refs/heads/integrate-resukisu'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: droidspaces-resukisu-${{ github.run_number }}
          name: "Droidspaces + ReSukiSU Build #${{ github.run_number }}"
          body: |
            ## Droidspaces + ReSukiSU Kernel for LeMax2 (x2)

            | 文件 | 说明 |
            |------|------|
            | `Droidspaces-ReSukiSU-x2.zip` | Droidspaces + ReSukiSU Root，AnyKernel3 格式 |
            | `Droidspaces-APatch-x2-kernel.zip` | Droidspaces + APatch 内核，已内置超级密钥 |
            | `boot-stock-lineage.img` | 原厂 LineageOS boot.img，备用 |

            **APatch SuperKey**: `123456789`
            **ReSukiSU Manager**: 从 [GitHub Actions nightly](https://github.com/ReSukiSU/ReSukiSU/actions) 获取
          files: |
            Droidspaces-ReSukiSU-x2.zip
            Droidspaces-APatch-x2-kernel.zip
            prebuilts/boot-stock-lineage.img
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
